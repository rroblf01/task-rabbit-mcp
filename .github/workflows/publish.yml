name: Publish Docker image

# A tag, and nothing else. Deliberately not on push to main: this image can
# create git branches and run a repository's test suite, so what it contains
# deserves a version someone chose rather than whatever the last commit happened
# to be. `ci.yml` covers every push, so the commit behind a tag has already been
# through the test suite by the time this runs — and the verify job below checks
# again anyway, because a tag can be pushed on a commit that never went through
# main and "CI was green" is then a statement about something else.
#
# Push a tag and this builds and pushes:
#
#   git tag v1.0.0 && git push origin v1.0.0
#
# The image goes to ghcr.io, tagged with the semver, the major.minor, the major,
# and latest.
on:
  push:
    tags: ["v*"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  # Two tags in a row must not race on the same image tags.
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: fmt · vet · test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
      # The prose check is CI-blocking everywhere else and belongs here too: an
      # image whose instructions name a tool that does not exist is worse than no
      # image, and it would still be pullable.
      - name: instructions name no phantom tools
        run: |
          go build -o /tmp/task-rabbit-mcp ./cmd/task-rabbit-mcp/
          go run ./cmd/phantom -server /tmp/task-rabbit-mcp

  build-and-push:
    name: image
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Strip the leading v. The server reports this string over MCP in its
      # initialize response, which is how somebody tells two builds apart, and a
      # version with a v in it is one thing to remember and another to grep for.
      - name: Read the version from the tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # The Dockerfile does not build Go itself for the target platform: it
      # compiles with TARGETOS/TARGETARCH under QEMU. That is slow and it needs
      # binfmt registered, which is what this step does.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          # jirrabit is commonly self-hosted on a small ARM VPS, and a
          # linux/amd64-only image would make the server unusable there.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # An image that was pushed and cannot start is the failure mode worth
      # catching here, where it is visible, rather than in somebody's compose file.
      - name: The pushed image serves MCP
        run: |
          docker run -d --name tr-publish -p 127.0.0.1:8083:8083 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
          for _ in $(seq 1 30); do
            if docker exec tr-publish /healthcheck; then
              echo "the published image answers an MCP initialize"
              docker logs tr-publish
              exit 0
            fi
            sleep 2
          done
          echo "the published image never answered"; docker logs tr-publish; exit 1